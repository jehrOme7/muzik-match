<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>สุ่ม Playlist — Muzik Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+Thai:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d0a1a;--card:#1a1730;--text:#f0eeff;--text2:rgba(240,238,255,0.6);--green:#1db954;--green2:#17a348}
body{font-family:'Inter','Noto Sans Thai',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
nav{padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.08)}
.wrap{max-width:600px;margin:0 auto;padding:70px 24px 80px;text-align:center}
.btn-shuffle{width:100%;padding:20px;background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;border:none;border-radius:18px;font-size:18px;font-weight:800;cursor:pointer}
.card{display:none;background:var(--card);border-radius:22px;padding:24px;text-align:left;margin-top:28px}
</style>
</head>
<body>
<nav>
  <strong style="font-size:18px">Muzik<span style="color:#a78bfa">Match</span></strong>
  <a href="/" style="color:var(--text2);text-decoration:none">← หน้าหลัก</a>
</nav>
<div class="wrap">
  <h1 style="font-size:36px;font-weight:900;margin-bottom:12px">สุ่ม Playlist</h1>
  <p style="color:var(--text2);margin-bottom:30px">ปล่อยให้อารมณ์พาไป สุ่มเพลย์ลิสต์ Spotify ทันที</p>
  <button class="btn-shuffle" onclick="shufflePlaylist()">🎲 สุ่ม Playlist</button>
  <div class="card" id="resultCard">
    <div style="font-size:32px" id="resEmoji">🎵</div>
    <div style="font-size:20px;font-weight:800;margin:6px 0" id="resName">—</div>
    <div style="color:var(--text2);font-size:14px;margin-bottom:16px" id="resDesc">—</div>
    <a id="resLink" href="#" target="_blank" style="display:inline-block;padding:12px 24px;background:var(--green);color:#fff;text-decoration:none;border-radius:12px;font-weight:700">เปิดใน Spotify 🎧</a>
  </div>
</div>
<script>
var _playlists = [];
fetch('/data/playlists.json').then(r=>r.json()).then(d=>{_playlists=d;});
function shufflePlaylist(){
  if(!_playlists.length) return;
  var p = _playlists[Math.floor(Math.random()*_playlists.length)];
  document.getElementById('resEmoji').textContent = p.emoji;
  document.getElementById('resName').textContent = p.name;
  document.getElementById('resDesc').textContent = p.desc;
  document.getElementById('resLink').href = p.url;
  document.getElementById('resultCard').style.display = 'block';
}
</script>
</body>
</html>
